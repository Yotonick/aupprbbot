<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Админка расписания</title>
<style>
:root{
  --bg:#0a0a0b; --card:#141416; --card2:#1c1c1f; --line:#2b2b30; --text:#fff; --muted:#8e8e93;
  --accent:#4f5bff; --accent-rgb:79,91,255; --ok:#33d63c; --warn:#ff9f1c; --bad:#ff5a5a;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f2f2f7; --card:#fff; --card2:#ececf2; --line:#dcdce3; --text:#0b0b0c; --muted:#6c6c72; --ok:#17a526; --warn:#e07b00; --bad:#d92d2d; color-scheme:light}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:110px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 0}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
.sub{margin:2px 0 18px;color:var(--muted);font-weight:600}
.sub a{color:var(--accent);font-weight:700;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 12px}
input,textarea,select{display:block;width:100%;margin-top:6px;background:var(--card2);color:var(--text);border:1px solid transparent;border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;font-weight:600;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:110px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;font-weight:800;font-size:15px}
.btn.p{background:var(--accent);color:#fff}
.btn.s{background:var(--card2)}
.btn.d{background:rgba(255,90,90,.14);color:var(--bad)}
.btn.w{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.sm{font-size:13px;color:var(--muted);font-weight:600;line-height:1.45}
.sm code{background:var(--card2);border-radius:6px;padding:1px 5px}
.sm ol{padding-left:18px;margin:6px 0}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;text-transform:uppercase;letter-spacing:.03em}
.st.on{background:rgba(51,214,60,.16);color:var(--ok)}
.st.plan{background:rgba(var(--accent-rgb),.16);color:var(--accent)}
.st.off{background:var(--card2);color:var(--muted)}
.st.cancel{background:rgba(255,90,90,.16);color:var(--bad)}
.st.edit,.st.add{background:rgba(var(--accent-rgb),.16);color:var(--accent)}
.connok{display:flex;align-items:center;justify-content:space-between;gap:10px}
.connok b{color:var(--ok)}
.err{color:var(--bad);font-weight:700;font-size:14px;margin:6px 0 10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card2);border-radius:14px;padding:4px;margin:4px 0 14px}
.tabs button{padding:10px;border-radius:11px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--accent);color:#fff}
.it{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.it.past{opacity:.55}
.it .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.it .h .g{font-size:12px;color:var(--muted);font-weight:700}
.it b.t{display:block;font-size:16px}
.it p{margin:4px 0 0;font-size:14px;line-height:1.4;color:var(--text);overflow-wrap:anywhere}
.it .meta{margin-top:6px;font-size:13px;color:var(--muted);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts .btn{padding:8px 12px;font-size:14px;border-radius:11px}
.ctl{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.ctl select{width:auto;flex:1}
.dnav{display:flex;gap:6px;align-items:center;flex:1.4}
.dnav input{margin:0}
.dnav button{flex:none;width:42px;height:44px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:800;color:var(--accent)}
.dttl{font-size:20px;font-weight:800;margin:6px 2px 10px}
.ls{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.ls.x{border-color:rgba(var(--accent-rgb),.55)}
.ls.cx{border-color:rgba(255,90,90,.5)}
.ls .tm{flex:none;width:52px;font-weight:800;line-height:1.2}
.ls .tm span{display:block;font-size:12px;color:var(--muted)}
.ls .bd{flex:1;min-width:0}
.ls .bd b{display:block;font-size:15px;line-height:1.25}
.ls .bd .ty{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.ls .bd .ch{margin-top:6px;font-size:13px;font-weight:700;line-height:1.4}
.ls.cx .bd>b{text-decoration:line-through;opacity:.7}
.none{color:var(--muted);font-weight:600;padding:8px 2px 14px}
h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:24px 4px 10px}
.pub{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--card);border-top:1px solid var(--line);display:none}
.pub.on{display:block}
.pub .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.pub .tx{flex:1;font-size:14px;font-weight:700;line-height:1.3}
.pub .tx small{display:block;color:var(--muted);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.mbox{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
@media (min-width:700px){.ov{align-items:center}.mbox{border-radius:24px}}
.mbox h2{margin:0 0 4px;font-size:22px}
.mbox .lsn{color:var(--muted);font-weight:600;margin-bottom:16px;font-size:14px}
.mact{display:flex;gap:10px;margin-top:6px}
.mact .btn{flex:1}
.gchk{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.gchk label,.chk{display:flex;align-items:center;gap:8px;margin:0;background:var(--card2);border-radius:12px;padding:10px 12px;color:var(--text);font-size:15px;cursor:pointer}
.gchk input,.chk input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--accent)}
.chk{margin-bottom:14px}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.slots button{background:var(--card2);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);max-width:560px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;z-index:80;text-align:center;opacity:0;transform:translateY(20px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast.err{background:var(--bad);color:#fff}
details summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px;margin:4px 0 8px}
/* посетители */
.tabs{grid-template-columns:1fr 1fr 1fr}
.tabs button{padding:10px 4px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.tile span{font-size:11.5px;color:var(--muted);font-weight:700}
.tile.on b{color:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding:8px 2px 0}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .c i{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px}
.chart .c.td i{background:var(--ok)}
.chart .c em{font-style:normal;font-size:10px;color:var(--muted);font-weight:700}
.chart .c small{font-size:10.5px;font-weight:800}
.vf{display:flex;gap:8px;margin:4px 0 10px}
.vf input{margin:0;flex:1.4}.vf select{margin:0;flex:1;width:auto}
.u{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:7px}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.u .ui{flex:1;min-width:0}
.u .ui b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .ui span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .ut{flex:none;text-align:right;font-size:12.5px;font-weight:700;color:var(--muted)}
.u .ut.on{color:var(--ok)}
.u .ut small{display:block;font-weight:600;margin-top:2px}
.seen{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--accent);background:rgba(var(--accent-rgb),.12);border-radius:10px;padding:5px 10px;margin-top:8px}
.hd{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 6px}
.sr{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--card2);border-radius:12px;margin-bottom:5px;font-size:14px;font-weight:600}
.sr span:last-child{color:var(--muted);text-align:right}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ph .av{width:56px;height:56px;font-size:20px}
</style>
</head>
<body>
<main>
  <h1>Админка</h1>
  <div class="sub">Объявления и изменения пар · <a href="schedule.html" target="_blank" rel="noopener">открыть расписание</a></div>
  <section class="card" id="conn"></section>
  <div class="tabs" id="tabs"><button data-t="ann" class="on">Объявления</button><button data-t="chg">Изменения пар</button><button data-t="vis">Посетители</button></div>
  <section id="body"></section>
</main>
<div class="pub" id="pub"><div class="in"><div class="tx" id="pubTx"></div><button class="btn s" id="pubUndo">Сбросить</button><button class="btn p" id="pubBtn">Опубликовать</button></div></div>
<div class="ov" id="ov"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script src="tools/parser.js"></script>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WDS=['вс','пн','вт','ср','чт','пт','сб'];
const fd=k=>{const d=fromKey(k);return WDS[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
const today=()=>key(new Date());
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const TYPE_NAME={'л':'Лекция','пз':'Практика','сз':'Семинар','лаб':'Лабораторная'};
const TYPES=[['л','Лекция'],['пз','Практика'],['сз','Семинар'],['лаб','Лабораторная'],['Зачёт','Зачёт'],['Экзамен','Экзамен'],['Консультация','Консультация']];
const ACT={cancel:'Отменена',edit:'Изменена',add:'Новая пара'};
const FILE='notices.json';

let cfg=Object.assign({token:'',owner:'',repo:'',branch:''},store.get('adm.cfg')||{});
let doc={v:1,notices:[],changes:[]},sha=null,dirty=false,log=[];
let conn='none',connMsg='',connOpen=false,busy=false;
let S=null,tab=store.get('adm.tab')||'ann',grp=null,day=today();

/* ---------- утилиты ---------- */
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast',err?5000:3000)}
const norm=d=>{d=d&&typeof d==='object'?d:{};d.v=1;if(!Array.isArray(d.notices))d.notices=[];if(!Array.isArray(d.changes))d.changes=[];return d};
const groups=()=>S&&S.groups?S.groups:[];
const gTxt=g=>!g||!g.length||(groups().length&&groups().every(x=>g.includes(x)))?'Все группы':g.join(', ');
const gHas=(x,g)=>!x.g||!x.g.length||x.g.includes(g);
function nameOf(c){const s=S&&S.subjects&&S.subjects[c];return(s&&s.name)||(c==='КЧ'?'Кураторский час':c)}
const typeOf=l=>l.k||TYPE_NAME[l.y]||l.y||'Занятие';
function roomOf(l){
  const s=(S&&S.subjects&&S.subjects[l.c])||{};
  if(l.r)return l.r;if(s.room)return s.room;if(s.ext)return '';
  if(l.y==='л'&&S.lectureRoom)return S.lectureRoom;
  if(l.y==='лаб'&&s.labRooms)return s.labRooms.replace(/\s*,\s*/g,' / ');
  return '';
}
const dayLessons=(g,d)=>S&&S.lessons?(S.lessons[g]||[]).filter(l=>l.d===d):[];
function baseOf(c){
  for(const g of (c.g&&c.g.length?c.g:groups())){const l=dayLessons(g,c.d).find(x=>x.t1===c.t1);if(l)return l}
  return null;
}
function describe(c){
  if(c.act==='cancel')return 'Отменена'+(c.note?' · '+c.note:'');
  const p=[];
  if(c.c)p.push(nameOf(c.c));else if(c.name)p.push(c.name);
  if(c.y)p.push(TYPE_NAME[c.y]||c.y);
  if(c.nt1||c.nt2)p.push('время '+(c.nt1||'')+'–'+(c.nt2||''));
  if(c.r)p.push('каб. '+c.r);
  if(c.tch)p.push(c.tch);
  if(c.note)p.push('«'+c.note+'»');
  return (c.act==='add'?'Новая: ':'→ ')+(p.join(' · ')||'без изменений');
}

/* ---------- GitHub ---------- */
function detect(){
  const m=/^([^.]+)\.github\.io$/i.exec(location.hostname);if(!m)return;
  if(!cfg.owner)cfg.owner=m[1];
  if(!cfg.repo){
    const seg=location.pathname.split('/').filter(Boolean);
    cfg.repo=seg.length>1?seg[0]:(seg.length===1&&!/\.html?$/i.test(seg[0]))?seg[0]:m[1]+'.github.io';
  }
}
async function gh(path,opt){
  opt=opt||{};
  const h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28'};
  if(opt.body)h['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'});
  let j=null;try{j=await r.json()}catch(e){}
  return{status:r.status,ok:r.ok,j};
}
const apiErr=(r,what)=>r.status===401?'Токен неверный или истёк':
  r.status===403?'Нет доступа: токену нужно право Contents → Read and write'+(r.j&&r.j.message?' ('+r.j.message+')':''):
  r.status===404?what+' не найден (или токен не даёт к нему доступа)':
  'Ошибка GitHub '+r.status+(r.j&&r.j.message?': '+r.j.message:'');
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
const repoPath=()=>'/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo);

async function connect(){
  if(!cfg.token||!cfg.owner||!cfg.repo){conn='none';render();return}
  conn='busy';render();
  try{
    const r=await gh(repoPath());
    if(!r.ok)throw new Error(apiErr(r,'Репозиторий '+cfg.owner+'/'+cfg.repo));
    if(r.j.permissions&&r.j.permissions.push===false)throw new Error('У токена нет права записи в этот репозиторий');
    if(!cfg.branch)cfg.branch=r.j.default_branch||'main';
    store.set('adm.cfg',cfg);
    await loadDoc();
    conn='ok';connMsg=cfg.owner+'/'+cfg.repo+' · '+cfg.branch;connOpen=false;
  }catch(e){conn='err';connMsg=e.message||String(e);connOpen=true;render();await loadPublic();return}
  render();loadStats(true);
}
async function loadDoc(){
  const r=await gh(repoPath()+'/contents/'+FILE+'?ref='+encodeURIComponent(cfg.branch)+'&t='+Date.now());
  let remote,rsha=null;
  if(r.status===404)remote=norm({});
  else if(!r.ok)throw new Error(apiErr(r,'Файл '+FILE));
  else{rsha=r.j.sha;try{remote=norm(JSON.parse(b64d(r.j.content)))}catch(e){throw new Error(FILE+' повреждён: '+e.message)}}
  const dr=store.get('adm.draft');
  if(dr&&dr.doc&&dr.base===rsha){doc=norm(dr.doc);log=dr.log||[];dirty=true;toast('Восстановлен неопубликованный черновик')}
  else{if(dr&&dr.doc)toast('Черновик устарел (файл изменился) и сброшен',true);store.del('adm.draft');doc=remote;dirty=false;log=[]}
  sha=rsha;
}
async function loadPublic(){
  try{const r=await fetch(FILE+'?t='+Date.now(),{cache:'no-store'});if(r.ok&&conn!=='ok'){doc=norm(await r.json());render()}}catch(e){}
  loadStats(true);
}
function markDirty(msg){
  dirty=true;log.push(msg);
  store.set('adm.draft',{base:sha,doc,log});
  render();
}
async function publish(){
  if(conn!=='ok'){toast('Сначала подключите GitHub',true);connOpen=true;render();return}
  if(busy)return;busy=true;renderPub();
  try{
    const uniq=[...new Set(log)];
    const body={message:'Админка: '+(uniq.length?uniq.slice(0,5).join('; ')+(uniq.length>5?' и ещё '+(uniq.length-5):''):'обновление объявлений'),
      content:b64e(JSON.stringify(doc,null,2)+'\n'),branch:cfg.branch};
    if(sha)body.sha=sha;
    const r=await gh(repoPath()+'/contents/'+FILE,{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||(r.status===422&&!sha))throw new Error('Файл на GitHub успел измениться (например, с другого устройства). Нажмите «Сбросить» и внесите правки заново.');
    if(!r.ok)throw new Error(apiErr(r,'Файл'));
    sha=r.j&&r.j.content&&r.j.content.sha||sha;
    dirty=false;log=[];store.del('adm.draft');
    toast('Опубликовано ✓ У всех появится через 1–2 минуты');
    setTimeout(()=>loadStats(true),500);
  }catch(e){toast(e.message||String(e),true)}
  busy=false;render();
}
async function discard(){
  if(!confirm('Сбросить все неопубликованные правки?'))return;
  store.del('adm.draft');dirty=false;log=[];
  if(conn==='ok'){try{await loadDoc()}catch(e){toast(e.message,true)}}else await loadPublic();
  render();
}

/* ---------- расписание ---------- */
async function loadSched(){
  try{
    if(typeof parseSchedule!=='function'||typeof readXlsx!=='function')throw new Error('не загрузился tools/parser.js');
    const r=await fetch('schedule.xlsx?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('schedule.xlsx: HTTP '+r.status);
    S=parseSchedule(readXlsx(await r.arrayBuffer()),'schedule.xlsx');
    grp=store.get('adm.grp');if(!S.groups.includes(grp))grp=S.groups[0];
  }catch(e){S={err:e.message||String(e)}}
  render();
}
function slots(){
  const m=new Map();
  if(S&&S.lessons)for(const g in S.lessons)for(const l of S.lessons[g])m.set(l.t1+'–'+l.t2,[l.t1,l.t2]);
  return[...m.values()].sort((a,b)=>a[0].localeCompare(b[0]));
}

function findChange(d,t1,g){return doc.changes.find(c=>c.act!=='add'&&c.d===d&&c.t1===t1&&gHas(c,g))}

  const b=$('#body');

  if(S.err){b.innerHTML='<div class="card err">Не удалось загрузить расписание: '+esc(S.err)+'</div>';return}
  const base=dayLessons(grp,day);
  const adds=doc.changes.filter(c=>c.act==='add'&&c.d===day&&gHas(c,grp));
  const rows=base.map(l=>{

      (canEdit()?'<div class="acts">'+(c?'<button class="btn s" data-cedit="'+esc(c.id)+'" data-t="'+l.t1+'">Изменить</button><button class="btn d" data-crm="'+esc(c.id)+'">Вернуть как было</button>':

  }).concat(adds.map(c=>'<div class="ls x"><div class="tm">'+esc(c.nt1)+'<span>'+esc(c.nt2)+'</span></div><div class="bd"><b>'+esc(c.c?nameOf(c.c):c.name||'Занятие')+'</b>'+
      '<div class="ty">'+esc(c.y?(TYPE_NAME[c.y]||c.y):'Занятие')+(c.r?' · каб. '+esc(c.r):'')+'</div><div class="ch"><span class="st add">Новая пара</span> '+esc(c.note||'')+'<div class="sm">'+esc(gTxt(c.g))+'</div></div>'+

      '<b class="t">'+esc(nm)+'</b><p>'+esc(describe(c))+'</p>'+seenBadge(c.id,c.g)+
      '<div class="acts"><button class="btn s" data-go="'+esc(c.id)+'">Открыть день</button>'+(canEdit()?'<button class="btn d" data-crm="'+esc(c.id)+'">Удалить</button>':'')+'</div></div>';
  }).join('');

  b.innerHTML=lockNote()+
    '<div class="ctl">'+(groups().length>1?'<select id="cG">'+groups().map(g=>'<option'+(g===grp?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>':'')+
    '<div class="dnav"><button id="dP" aria-label="Предыдущий день">‹</button><input type="date" id="cD" value="'+day+'"><button id="dN" aria-label="Следующий день">›</button></div></div>'+

  const byT=t1=>base.find(l=>l.t1===t1);

    doc.changes=doc.changes.filter(y=>y!==c);markDirty('убрано изменение '+fd(c.d)+' '+(c.t1||c.nt1));

  b.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{
    const c=doc.changes.find(y=>y.id===x.dataset.go);if(!c)return;
    day=c.d;if(c.g&&c.g.length&&!c.g.includes(grp))grp=c.g[0];renderChg();window.scrollTo({top:0,behavior:'smooth'});

    const note=$('#fC').value.trim();
    if(mode!=='cancel'){
      const s=$('#fS').value,nm=($('#fN').value||'').trim(),y=$('#fY').value,r=$('#fR').value.trim(),a=$('#fA').value,bb=$('#fB').value,p=$('#fP').value.trim();
      if(s==='__o'){if(!nm){toast('Введите название предмета',true);return}o.name=nm}
      else if(s&&!(mode==='edit'&&l&&s===l.c))o.c=s;
      if(mode==='add'&&!o.c&&!o.name){toast('Выберите предмет',true);return}
      if(y)o.y=y;
      if(r)o.r=r;
      if(p)o.tch=p;
      if(mode==='add'){
        if(!a||!bb){toast('Укажите время начала и конца',true);return}
        o.nt1=a;o.nt2=bb;
      }else{
        if(a&&a!==l.t1)o.nt1=a;
        if(bb&&bb!==l.t2)o.nt2=bb;
      }
      if((o.nt1||a)&&(o.nt2||bb)&&(o.nt1||a)>=(o.nt2||bb)){toast('Конец пары должен быть позже начала',true);return}
      if(mode==='edit'&&!o.c&&!o.name&&!o.y&&!o.r&&!o.tch&&!o.nt1&&!o.nt2&&!note){toast('Вы ничего не изменили',true);return}
    }
    if(note)o.note=note;
    let g=readGroups();
    if(g&&!g.length){toast('Выберите хотя бы одну группу',true);return}
    o.g=g||(gs.length>1?[grp]:[]);
    // одна пара — одно изменение: снимаем пересечения с другими правками этого же слота
    if(mode!=='add'){
      doc.changes=doc.changes.filter(x=>{
        if(x===c||x.act==='add'||x.d!==o.d||x.t1!==o.t1)return true;
        const xg=x.g&&x.g.length?x.g:gs;
        x.g=o.g.length?xg.filter(q=>!o.g.includes(q)):[];
        return x.g.length>0;
      });
    }
    const i=c?doc.changes.indexOf(c):-1;
    if(i>=0)doc.changes[i]=o;else doc.changes.push(o);
    closeModal();
    markDirty((mode==='cancel'?'отмена пары ':mode==='add'?'новая пара ':'изменение пары ')+fd(o.d)+' '+(o.t1||o.nt1));
  };
}

/* --- посетители (Cloudflare Worker, папка worker/) --- */
/* Адрес воркера вписывается сюда после развёртывания; его можно поменять и на странице. */
const STATS_API_DEFAULT='https://schedule-stats.yotonick.workers.dev';
let st=Object.assign({url:STATS_API_DEFAULT,key:''},store.get('adm.st')||{});
if(!st.url)st.url=STATS_API_DEFAULT;
let ST={ov:null,views:new Map(),err:'',busy:false,setup:false,at:0},vq='',vg='';
const stOK=()=>!!(st.url&&st.key);
async function stGet(path){
  const r=await fetch(st.url.replace(/\/+$/,'')+path,{headers:{authorization:'Bearer '+st.key},cache:'no-store'});
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401)throw new Error('Неверный пароль статистики');
  if(!r.ok||!j||!j.ok)throw new Error((j&&j.error)||('Сервер статистики: HTTP '+r.status));
  return j;
}
async function loadStats(force){
  if(!stOK()||ST.busy)return;
  if(!force&&Date.now()-ST.at<15000)return;
  ST.busy=true;
  try{
    const ids=doc.notices.map(n=>n.id).concat(doc.changes.map(c=>c.id)).slice(-100);
    const [ov,vw]=await Promise.all([stGet('/api/admin/overview?days=14'),ids.length?stGet('/api/admin/views?ids='+encodeURIComponent(ids.join(','))):{views:[]}]);
    ST.ov=ov;ST.views=new Map();vw.views.forEach(v=>{if(!ST.views.has(v.item_id))ST.views.set(v.item_id,[]);ST.views.get(v.item_id).push(v)});
    ST.err='';ST.at=Date.now();
  }catch(e){ST.err=e.message||String(e)}
  ST.busy=false;render();
}
setInterval(()=>{if(!document.hidden&&tab==='vis')loadStats(true)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadStats()});

const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const isOn=u=>Date.now()-u.last_seen<150000;
function ago(ms){
  const d=Date.now()-ms;
  if(d<150000)return 'сейчас';
  const m=Math.round(d/60000);if(m<60)return m+' мин назад';
  const dt=new Date(ms);if(m<360)return Math.floor(m/60)+' ч назад';
  const k=key(dt);
  return(k===today()?'сегодня':k===key(addDays(new Date(),-1))?'вчера':dt.getDate()+' '+MON[dt.getMonth()])+' в '+hm(dt);
}
const uName=u=>[u.first_name,u.last_name].filter(Boolean).join(' ')||(u.username?'@'+u.username:'id '+u.id);
const PLAT={android:'Android',ios:'iPhone',tdesktop:'Telegram Desktop',macos:'macOS',weba:'Telegram Web',webk:'Telegram Web',web:'Telegram Web',unigram:'Unigram'};
const plat=p=>PLAT[p]||p||'—';
const AVC=['#4f5bff','#2d9cff','#19c37d','#ff9f1c','#ff5a7a','#b069ff','#14b8a6'];
function avatar(u){
  const ini=((u.first_name||'?')[0]+((u.last_name||'')[0]||'')).toUpperCase();
  return '<span class="av'+(isOn(u)?' on':'')+'" style="background:'+AVC[Math.abs(u.id)%AVC.length]+'">'+esc(ini)+
    (u.photo&&/^https:\/\//.test(u.photo)?'<img src="'+esc(u.photo)+'" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">':'')+'</span>';
}
function dur(a,b){const m=Math.round((b-a)/60000);return m<1?'меньше минуты':m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60?m%60+' мин':'')}

function stSetupHTML(){
  return '<div class="card"><h2>Статистика посещений</h2>'+(ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+
    '<label>Адрес сервера статистики<input id="sUrl" autocomplete="off" placeholder="https://schedule-stats.…workers.dev" value="'+esc(st.url)+'"></label>'+
    '<label>Пароль статистики<input id="sKey" type="password" autocomplete="off" value="'+esc(st.key)+'"></label>'+
    '<div class="acts" style="margin:0"><button class="btn p" id="sSave">Подключить</button>'+(st.key?'<button class="btn d" id="sOut">Забыть пароль</button>':'')+(stOK()&&!ST.err?'<button class="btn s" id="sClose">Свернуть</button>':'')+'</div>'+
    '<div class="sm" style="margin-top:10px">Пароль — тот, что вы задали серверу как ADMIN_KEY. Хранится только в этом браузере.</div></div>';
}
function bindSetup(){
  const s=$('#sSave');if(!s)return;
  s.onclick=()=>{st.url=$('#sUrl').value.trim().replace(/\/+$/,'');st.key=$('#sKey').value;store.set('adm.st',st);if(!stOK()){toast('Заполните адрес и пароль',true);return}ST.setup=false;ST.err='';ST.at=0;loadStats(true)};
  const o=$('#sOut');if(o)o.onclick=()=>{st.key='';store.set('adm.st',st);ST.ov=null;render()};
  const c=$('#sClose');if(c)c.onclick=()=>{ST.setup=false;render()};
}
function renderVis(){
  const b=$('#body');
  if(!stOK()||ST.setup||(ST.err&&!ST.ov)){b.innerHTML=stSetupHTML();bindSetup();return}
  if(!ST.ov){b.innerHTML='<div class="none">Загружаем статистику…</div>';loadStats();return}
  const ov=ST.ov,users=ov.users,t=ov.today;
  const dayAgo=Date.now()-864e5*7;
  const todayU=(ov.daily.find(d=>d.day===t)||{}).users||0;
  const tiles=[[users.filter(isOn).length,'сейчас','on'],[todayU,'сегодня',''],[users.filter(u=>u.last_seen>=dayAgo).length,'за 7 дней',''],[users.length,'всего','']];
  const days=[];for(let i=13;i>=0;i--)days.push(key(addDays(fromKey(t),-i)));
  const dm=new Map(ov.daily.map(d=>[d.day,d])),am=new Map(ov.anon.map(d=>[d.day,d.devices]));
  const mx=Math.max(1,...days.map(d=>(dm.get(d)||{}).users||0));
  const chart='<div class="card"><div class="sm" style="font-weight:800">Люди по дням (Telegram)</div><div class="chart">'+days.map(d=>{
    const v=(dm.get(d)||{}).users||0,an=am.get(d)||0,dt=fromKey(d);
    return '<div class="c'+(d===t?' td':'')+'" title="'+fd(d)+': '+v+' чел., заходов '+((dm.get(d)||{}).visits||0)+(an?', без Telegram: '+an:'')+'"><small>'+(v||'')+'</small><i style="height:'+Math.round(v/mx*76)+'px"></i><em>'+dt.getDate()+'</em></div>';
  }).join('')+'</div>'+(am.get(t)?'<div class="sm" style="margin-top:6px">Сегодня без Telegram (в браузере): '+am.get(t)+' устр.</div>':'')+'</div>';
  const gs=[...new Set(users.map(u=>u.grp).filter(Boolean))].sort();
  const q=vq.trim().toLowerCase();
  const list=users.filter(u=>(!vg||u.grp===vg)&&(!q||(uName(u)+' '+(u.username||'')).toLowerCase().includes(q)));
  b.innerHTML='<div class="tiles">'+tiles.map(([v,l,c])=>'<div class="tile '+c+'"><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div>'+chart+
    '<div class="vf"><input id="vQ" type="search" placeholder="Поиск по имени" value="'+esc(vq)+'">'+(gs.length>1?'<select id="vG"><option value="">Все группы</option>'+gs.map(g=>'<option'+(g===vg?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>':'')+'</div>'+
    (list.length?list.map(u=>'<button class="u" data-u="'+u.id+'">'+avatar(u)+'<span class="ui"><b>'+esc(uName(u))+'</b><span>'+esc([u.username?'@'+u.username:'',u.grp,plat(u.platform)].filter(Boolean).join(' · '))+'</span></span>'+
      '<span class="ut'+(isOn(u)?' on':'')+'">'+(isOn(u)?'🟢 сейчас':esc(ago(u.last_seen)))+'<small>'+u.visits+' '+(u.visits%10===1&&u.visits%100!==11?'заход':u.visits%10>=2&&u.visits%10<=4&&(u.visits%100<12||u.visits%100>14)?'захода':'заходов')+'</small></span></button>').join('')
      :'<div class="none">'+(users.length?'Никого не найдено.':'Пока никто не заходил через Telegram. Данные появятся после первого открытия приложения.')+'</div>')+
    '<div class="acts" style="margin-top:14px"><button class="btn s" id="vRef">Обновить</button><button class="btn s" id="vSet">Настройки статистики</button></div>'+
    '<div class="sm" style="margin-top:8px">Обновлено '+hm(new Date(ST.at))+(ST.err?' · <span style="color:var(--bad)">'+esc(ST.err)+'</span>':'')+'. «Сейчас» — приложение открыто в последние 2–3 минуты.</div>';
  const qi=$('#vQ');qi.oninput=e=>{vq=e.target.value;const p=qi.selectionStart;renderVis();const n=$('#vQ');n.focus();n.setSelectionRange(p,p)};
  const g=$('#vG');if(g)g.onchange=e=>{vg=e.target.value;renderVis()};
  $('#vRef').onclick=()=>loadStats(true);
  $('#vSet').onclick=()=>{ST.setup=true;renderVis()};
  b.querySelectorAll('[data-u]').forEach(x=>x.onclick=()=>userModal(+x.dataset.u));
}
function itemTitle(id){
  const n=doc.notices.find(x=>x.id===id);if(n)return '📢 '+(n.title||n.text.slice(0,50));
  const c=doc.changes.find(x=>x.id===id);if(c)return '✏️ '+fd(c.d)+' '+(c.t1||c.nt1)+' — '+ACT[c.act].toLowerCase();
  return null;
}
async function userModal(id){
  const u0=ST.ov&&ST.ov.users.find(u=>u.id===id);if(!u0)return;
  modal('<div class="ph">'+avatar(u0)+'<div><h2>'+esc(uName(u0))+'</h2><div class="sm">Загружаем историю…</div></div></div><div class="mact"><button class="btn s" id="mCancel">Закрыть</button></div>');
  let j;try{j=await stGet('/api/admin/user?id='+id)}catch(e){toast(e.message,true);return}
  const u=j.user||u0;
  const byDay=new Map();j.sessions.forEach(s=>{const k=key(new Date(s.start));if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(s)});
  const vis=j.views.map(v=>[itemTitle(v.item_id),v.ts]).filter(x=>x[0]);
  modal('<div class="ph">'+avatar(u)+'<div><h2>'+esc(uName(u))+'</h2><div class="sm">'+esc([u.username?'@'+u.username:'',u.grp,plat(u.platform)].filter(Boolean).join(' · '))+'</div></div></div>'+
    '<div class="sr"><span>Последний раз</span><span>'+(isOn(u)?'🟢 сейчас в приложении':esc(ago(u.last_seen)))+'</span></div>'+
    '<div class="sr"><span>Первый заход</span><span>'+esc(fd(key(new Date(u.first_seen))))+' в '+hm(new Date(u.first_seen))+'</span></div>'+
    '<div class="sr"><span>Всего заходов</span><span>'+u.visits+'</span></div>'+
    (u.username?'<a class="btn s w" style="margin-top:8px;text-decoration:none" href="https://t.me/'+esc(u.username)+'" target="_blank" rel="noopener">Написать в Telegram</a>':'')+
    (vis.length?'<div class="hd">Видел(а)</div>'+vis.slice(0,30).map(([t,ts])=>'<div class="sr"><span>'+esc(t)+'</span><span>'+esc(ago(ts))+'</span></div>').join(''):'')+
    '<div class="hd">История заходов</div>'+([...byDay].map(([k,ss])=>'<div class="sm" style="margin:10px 2px 4px;font-weight:800">'+fd(k)+'</div>'+ss.map(s=>'<div class="sr"><span>'+hm(new Date(s.start))+(s.end-s.start>=60000?' – '+hm(new Date(s.end)):'')+'</span><span>'+dur(s.start,s.end)+' · '+esc(plat(s.platform))+'</span></div>').join('')).join('')||'<div class="none">Нет данных</div>')+
    '<div class="mact" style="margin-top:14px"><button class="btn s" id="mCancel">Закрыть</button></div>');
}
/* «видели N из M» под объявлением или изменением */
function audience(g){return ST.ov?ST.ov.users.filter(u=>!g||!g.length||g.includes(u.grp)):[]}
function seenBadge(id,g){
  if(!stOK()||!ST.ov)return '';
  const v=ST.views.get(id)||[],aud=audience(g);
  return '<button class="seen" data-seen="'+esc(id)+'">👁 видели '+v.length+(aud.length?' из '+aud.length:'')+'</button>';
}
function bindSeen(root){root.querySelectorAll('[data-seen]').forEach(x=>x.onclick=()=>seenModal(x.dataset.seen))}
function seenModal(id){
  const it=doc.notices.find(x=>x.id===id)||doc.changes.find(x=>x.id===id);if(!it)return;
  const v=ST.views.get(id)||[],um=new Map(ST.ov.users.map(u=>[u.id,u]));
  const saw=new Set(v.map(x=>x.user_id));
  const not=audience(it.g).filter(u=>!saw.has(u.id));
  const row=(u,right)=>'<button class="u" data-u="'+u.id+'">'+avatar(u)+'<span class="ui"><b>'+esc(uName(u))+'</b><span>'+esc(u.grp||'')+'</span></span><span class="ut">'+right+'</span></button>';
  modal('<h2>'+esc(itemTitle(id)||'')+'</h2><div class="lsn">Видели '+v.length+(audience(it.g).length?' из '+audience(it.g).length:'')+'</div>'+
    (v.length?'<div class="hd">Видели</div>'+v.slice().sort((a,b)=>b.ts-a.ts).map(x=>{const u=um.get(x.user_id)||{id:x.user_id,first_name:'id '+x.user_id};return row(u,esc(ago(x.ts)))}).join(''):'')+
    (not.length?'<div class="hd">Ещё не видели</div>'+not.map(u=>row(u,'был(а) '+esc(ago(u.last_seen)))).join(''):'')+
    '<div class="sm" style="margin-top:10px">Учитываются только заходы через Telegram.</div><div class="mact" style="margin-top:12px"><button class="btn s" id="mCancel">Закрыть</button></div>');
  $('#mbox').querySelectorAll('[data-u]').forEach(x=>x.onclick=()=>userModal(+x.dataset.u));
}

function renderPub(){
  const p=$('#pub');
  p.classList.toggle('on',dirty);
  if(!dirty)return;
  $('#pubTx').innerHTML='Не опубликовано: '+log.length+' '+(log.length===1?'правка':log.length<5?'правки':'правок')+'<small>Студенты увидят после «Опубликовать»</small>';

}
$('#pubBtn').onclick=publish;
$('#pubUndo').onclick=discard;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

detect();
render();
loadSched();
if(cfg.token)connect();else loadPublic();
})();
